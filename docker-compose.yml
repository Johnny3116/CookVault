services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookvault
      POSTGRES_PASSWORD: cookvault
      POSTGRES_DB: cookvault
    volumes:
      - cookvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend runs migrations at boot, so it must not start until
      # Postgres is actually accepting connections -- not merely running.
      test: ["CMD-SHELL", "pg_isready -U cookvault -d cookvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cookvault
    # Intentionally not exposed to the host: NexusBody's port sweep found 5432
    # already in use by another container. Backend reaches this over the
    # compose network at postgres:5432.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://cookvault:cookvault@postgres:5432/cookvault
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback-only, and optional: the frontend proxies /api/* to the backend
      # over the compose network, so nothing outside the host needs this. Kept
      # for direct API poking and the interactive docs at /docs.
      - "127.0.0.1:8420:8000"
    networks:
      - cookvault

  assistant:
    # ChefNexus. Talks to Ollama on the host and to the backend's /agent surface;
    # reached only through the frontend's proxy, which checks the session
    # cookie first. See cookvault-assistant/README.md.
    build: ./cookvault-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      COOKVAULT_ORIGIN: http://backend:8000
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    extra_hosts:
      # Docker Desktop resolves host.docker.internal itself; this makes the
      # same AI_BASE_URL work on a plain Linux engine too.
      - "host.docker.internal:host-gateway"
    volumes:
      - cookvault_assistant_data:/app/data
    depends_on:
      - backend
    ports:
      # Loopback-only and optional, for poking /health directly.
      - "127.0.0.1:8520:8500"
    networks:
      - cookvault

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Server-side only -- the browser never sees these and never talks to
      # the backend or the assistant directly, so nothing is baked in at build
      # time and no rebuild is needed when an address changes.
      BACKEND_ORIGIN: http://backend:8000
      ASSISTANT_ORIGIN: http://assistant:8500
    depends_on:
      - backend
      - assistant
    ports:
      # The only port that needs `tailscale serve`.
      - "127.0.0.1:3420:3420"
    networks:
      - cookvault

networks:
  cookvault:

volumes:
  cookvault_pgdata:
  cookvault_assistant_data:
