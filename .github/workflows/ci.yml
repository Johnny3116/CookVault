name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cookvault
          POSTGRES_PASSWORD: cookvault
          POSTGRES_DB: cookvault
        ports:
          - 5432:5432
        # Steps start as soon as the container does, so without this the first
        # migration races Postgres' startup.
        options: >-
          --health-cmd "pg_isready -U cookvault -d cookvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cookvault:cookvault@localhost:5432/cookvault

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check migrations match the models
        working-directory: backend
        # Catches a model change that shipped without a migration.
        run: alembic check

      - name: Check migrations reverse cleanly
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        # Fails loudly if the lockfile and package.json drift.
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Build
        working-directory: frontend
        run: bun run build

  assistant:
    name: Assistant (typecheck + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: cookvault-assistant
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cookvault-assistant
        run: bun run typecheck

      - name: Run tests
        working-directory: cookvault-assistant
        # Offline: the model and CookVault are both faked. Nothing here
        # reaches Ollama; the live loop is proven by hand on NexusBody.
        run: bun test

  images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Deployment is Docker Compose, so a Dockerfile that no longer builds is
      # a broken deploy even when the app code is fine.
      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend

      - name: Build assistant image
        run: docker build ./cookvault-assistant
